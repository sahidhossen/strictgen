[package]
name = "example-basic"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "The Rust types strictgen generates for examples/basic/schemas"
license = "Apache-2.0"
publish = false

[lib]
name = "example_basic"

[dependencies]
# The schemas use pattern, which the generated code checks with the regex crate.
regex = "1.10"
serde = { version = "1", features = ["derive"] }
# raw_value for the serde bridge (serdeBridge in strictgen.json).
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
