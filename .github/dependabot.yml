version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 drops the transpileModule API the conformance driver and the docs snippets use,
      # so a major update needs its own change, not a bot bump.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The types follow the lowest supported Node (engines: >=22), so code can't use newer APIs.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: ["ci"]
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["ci"]
    commit-message:
      prefix: ci
  # The Rust conformance driver and example crates pin serde, serde_json and regex in Cargo.lock.
  - package-ecosystem: cargo
    directories:
      - /conformance/driver/rust
      - /examples/*/rust
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
    labels: ["ci"]
    commit-message:
      prefix: chore
  # The Go driver and examples use only the standard library today; this covers any module they add.
  - package-ecosystem: gomod
    directories:
      - /conformance/driver/go
      - /examples/*/go
    schedule:
      interval: weekly
    labels: ["ci"]
    commit-message:
      prefix: chore
