name: CI

on:
  pull_request:
    # edited re-runs the title and body check when either changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # The release workflow runs all of CI on the tagged commit before it publishes anything.
  workflow_call:
    secrets:
      HYGIENE_DENYLIST:
        required: true

permissions:
  contents: read

concurrency:
  # Pull requests share a group per branch. Every push to main gets its own
  # group, so no run on main is cancelled or dropped and every commit is checked.
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The playground page, bundled as Pages would serve it. Its tests above build it too.
      - run: pnpm playground:build

  package:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The exact file list of npm pack, then the tarball installed offline into an empty project,
      # where npx strictgen --version, a built in profile and import("strictgen") must work.
      - run: node scripts/package-check.mjs
      # npm publish stops in its prepublishOnly guard outside the release workflow's tag run.
      - name: The publish guard refuses this run
        run: |
          if node scripts/publish-guard.mjs; then
            echo "The publish guard let a run that isn't a release through."
            exit 1
          fi

  binaries:
    name: Binaries
    uses: ./.github/workflows/binaries.yml

  examples:
    name: Examples are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # check compares with formatted output, so both formatters must be installed.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: pnpm build
      - name: Compare the committed output with strictgen check
        run: |
          node dist/cli.js check --config examples/basic/strictgen.json
          node dist/cli.js check --config examples/report/strictgen.json
          node dist/cli.js check --config examples/llm/strictgen.json
          node dist/cli.js check --config examples/quickstart/strictgen.json
      # check compared the first run with what is committed. A second run must write the
      # same files again, so generation is deterministic.
      - name: Generate again and check that nothing changes
        run: |
          node dist/cli.js generate --config examples/basic/strictgen.json
          node dist/cli.js generate --config examples/report/strictgen.json
          node dist/cli.js generate --config examples/llm/strictgen.json
          node dist/cli.js generate --config examples/quickstart/strictgen.json
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Typecheck the TypeScript output
        run: |
          pnpm exec tsc -p examples/basic/ts/tsconfig.json
          pnpm exec tsc -p examples/report/ts/tsconfig.json
          pnpm exec tsc -p examples/llm/ts/tsconfig.json
          pnpm exec tsc -p examples/quickstart/ts/tsconfig.json

  examples-rust:
    name: Rust example (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [basic, report, llm, quickstart]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The registry, the git checkouts and the crate's target folder, by Cargo.lock and toolchain.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/${{ matrix.example }}/rust
      # The generated files are formatted by strictgen; this keeps the hand written tests formatted too.
      - run: cargo fmt --check
      - run: cargo check --locked --all-targets
      # Pedantic lints on the generated code and the hand written tests alike.
      - run: cargo clippy --locked --all-targets -- -D warnings -W clippy::pedantic
      - name: Round trip the fixtures
        run: cargo test --locked

  examples-go:
    name: Go example (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [basic, report, llm, quickstart]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}/go
    steps:
      - uses: actions/checkout@v4
      # The module and build caches, by the example's go.mod (the examples need no go.sum).
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: examples/${{ matrix.example }}/go/go.mod
      - run: go vet ./...
      # -race also fails on any state the decoders share between goroutines, like an LLM decode's.
      - name: Round trip the fixtures
        run: go test -race -count=1 ./...

  conformance:
    name: Conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      # The driver's dependencies and its target folder, which the suite and the fuzzer build in,
      # so a run only compiles the generated code again.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            conformance/driver/rust/target
          key: conformance-rust-${{ runner.os }}-1.97.0-${{ hashFiles('conformance/driver/rust/Cargo.lock') }}
          restore-keys: conformance-rust-${{ runner.os }}-1.97.0-
      # The Go build cache, by the driver's go.mod (it has no dependencies, so no go.sum).
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: conformance/driver/go/go.mod
      # The suite fails on a missing toolchain too; this names the versions first.
      - name: Check the toolchains
        run: |
          cargo --version
          go version
      - name: The hand written drivers are formatted
        run: |
          test -z "$(gofmt -l conformance/driver/go)"
          # Formatted from stdin, so rustfmt doesn't look for the modules the runner generates.
          rustfmt --edition 2024 < conformance/driver/rust/src/main.rs | diff -u conformance/driver/rust/src/main.rs -
      # Every case in Rust, Go and TypeScript, in strict and report mode, through the public entry
      # points, the fixture registry and the LLM decoders, with the shared vectors of examples/llm.
      # It fails on a mapping rule or error code without a case too. The build is kept for the
      # lints below.
      - run: pnpm conformance --keep | tee conformance-run.txt
      # The drivers only build beside the generated code, so they are linted where the run built them.
      - name: Lint the drivers
        run: |
          dir="$(sed -n 's/^kept the generated code and drivers in //p' conformance-run.txt)"
          test -n "$dir"
          (cd "$dir/go" && go vet ./...)
          (cd "$dir/rust" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/conformance/driver/rust/target" cargo clippy --locked --all-targets -- -D warnings -W clippy::pedantic)
      # Random payloads and near misses of every conformance type through every decoder, with a
      # fixed seed, so a pull request fails the same way every time. The nightly run takes random
      # seeds and many more runs.
      - name: Fuzz with a fixed seed
        run: pnpm fuzz --seed 1 --runs 3000

  docs:
    name: Docs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The toolchain of the conformance job. explain output is formatted with its rustfmt.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt
      # The conformance driver's build, which the error code examples decode with, and the
      # quickstart crate's.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            conformance/driver/rust/target
            examples/quickstart/rust/target
          key: docs-rust-${{ runner.os }}-1.97.0-${{ hashFiles('conformance/driver/rust/Cargo.lock', 'examples/quickstart/rust/Cargo.lock') }}
          restore-keys: docs-rust-${{ runner.os }}-1.97.0-
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: |
            conformance/driver/go/go.mod
            examples/quickstart/go/go.mod
      # Every snippet of the README and docs made again from real output: files, generated code,
      # command output, and what the Rust, Go and TypeScript decoders print. Any difference fails.
      - run: pnpm docs:check

  hygiene:
    name: Public hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the commit range
        id: range
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            echo "base=" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      - run: scripts/hygiene.sh
        env:
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
          HYGIENE_BASE: ${{ steps.range.outputs.base }}
      - name: Check the PR title and body
        if: github.event_name == 'pull_request'
        run: printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | scripts/hygiene.sh --text
        env:
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
