name: CI

on:
  pull_request:
    # edited re-runs the title and body check when either changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull requests share a group per branch. Every push to main gets its own
  # group, so no run on main is cancelled or dropped and every commit is checked.
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  examples:
    name: Examples are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # check compares with formatted output, so both formatters must be installed.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: pnpm build
      - name: Compare the committed output with strictgen check
        run: |
          node dist/cli.js check --config examples/basic/strictgen.json
          node dist/cli.js check --config examples/report/strictgen.json
          node dist/cli.js check --config examples/llm/strictgen.json
      # check compared the first run with what is committed. A second run must write the
      # same files again, so generation is deterministic.
      - name: Generate again and check that nothing changes
        run: |
          node dist/cli.js generate --config examples/basic/strictgen.json
          node dist/cli.js generate --config examples/report/strictgen.json
          node dist/cli.js generate --config examples/llm/strictgen.json
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Typecheck the TypeScript output
        run: |
          pnpm exec tsc -p examples/basic/ts/tsconfig.json
          pnpm exec tsc -p examples/report/ts/tsconfig.json
          pnpm exec tsc -p examples/llm/ts/tsconfig.json

  examples-rust:
    name: Rust example (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [basic, report, llm]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The generated files are formatted by strictgen; this keeps the hand written tests formatted too.
      - run: cargo fmt --check
      - run: cargo check --locked --all-targets
      # Pedantic lints on the generated code and the hand written tests alike.
      - run: cargo clippy --locked --all-targets -- -D warnings -W clippy::pedantic
      - name: Round trip the fixtures
        run: cargo test --locked

  examples-go:
    name: Go example (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [basic, report, llm]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - name: Round trip the fixtures
        run: go test -count=1 ./...

  conformance:
    name: Conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      # The suite fails on a missing toolchain too; this names the versions first.
      - name: Check the toolchains
        run: |
          cargo --version
          go version
      - name: The hand written Go driver is formatted
        run: test -z "$(gofmt -l conformance/driver/go)"
      # Every case in Rust, Go and TypeScript, in strict and report mode.
      - run: pnpm conformance

  hygiene:
    name: Public hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the commit range
        id: range
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            echo "base=" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      - run: scripts/hygiene.sh
        env:
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
          HYGIENE_BASE: ${{ steps.range.outputs.base }}
      - name: Check the PR title and body
        if: github.event_name == 'pull_request'
        run: printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | scripts/hygiene.sh --text
        env:
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
