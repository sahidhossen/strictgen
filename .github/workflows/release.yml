name: Release

# Publishes strictgen to npm with provenance and creates the GitHub release with the binaries in
# archives (a .tar.gz per macOS and Linux platform, a .zip for Windows), the archives' SHA-256 sums
# and the CHANGELOG section of the version.
#
# A release happens only when a maintainer pushes a tag v<version> that matches package.json.
# Before anything is published:
#   - the repository must be public, or the guard job fails;
#   - the tag must equal "v" + package.json's version, point at a commit on main, and
#     CHANGELOG.md must have a "## [<version>] - YYYY-MM-DD" section;
#   - all of CI must pass on the tagged commit: typecheck, tests, the conformance suite, the
#     fixed-seed fuzz run, docs:check, the examples, hygiene, the npm package check and the
#     binaries on every platform.
# npm publish runs scripts/publish-guard.mjs first (prepublishOnly), which checks the tag and that
# this workflow is the one running.
#
# The npm job runs in the "release" environment, which holds the NPM_TOKEN secret and requires a
# maintainer to approve the run before the job starts. Only that job sees the token, and it fails
# when the secret isn't set. Set the environment up in Settings, Environments: required reviewers,
# deployment tags v*, and the NPM_TOKEN secret.
#
# Dry run: run this workflow by hand (Actions, Release, Run workflow) with dry_run checked. It runs
# every check and all of CI, builds the binaries, the archives, the sums, the notes and the npm
# tarball, and keeps them as the "release" artifact, then stops: the publish jobs are skipped, so
# it needs no approval. It works in a private repository and without NPM_TOKEN. Run by hand with
# dry_run unchecked, it fails.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check everything, publish nothing
        type: boolean
        required: true
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag, the version, the changelog and the repository
        id: check
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ "$DRY_RUN" != "true" ]]; then
              echo "::error::Run by hand, this workflow only does dry runs. Push the tag v$version to release."
              exit 1
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Dry run of $version: repository $VISIBILITY. Nothing will be published."
            node scripts/release-notes.mjs "$version" --dry-run > /dev/null
            exit 0
          fi
          if [[ "$EVENT" != "push" || "$GITHUB_REF" != "refs/tags/v$version" ]]; then
            echo "::error::The tag ${GITHUB_REF#refs/tags/} doesn't match package.json's version $version (expected v$version)."
            exit 1
          fi
          if [[ "$VISIBILITY" != "public" ]]; then
            echo "::error::The repository is $VISIBILITY. Releases are published from a public repository only."
            exit 1
          fi
          api_visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)"
          if [[ "$api_visibility" != "public" ]]; then
            echo "::error::The API says the repository is $api_visibility. Releases are published from a public repository only."
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag points at $GITHUB_SHA, which isn't on main."
            exit 1
          fi
          node scripts/release-notes.mjs "$version" > /dev/null
          echo "publish=true" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          VISIBILITY: ${{ github.event.repository.visibility }}
          GH_TOKEN: ${{ github.token }}

  ci:
    name: CI
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    secrets:
      HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}

  assemble:
    name: Assemble the release
    needs: [guard, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The binaries CI built and smoke tested on each platform. They go into the release only
      # inside the archives below.
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true
      # One archive per platform, holding the binary under the name it runs as: strictgen in a
      # .tar.gz for macOS and Linux, strictgen.exe in a .zip for Windows. The archives are the same
      # bytes for the same commit: entries sorted, the commit's time as every timestamp, owner and
      # group 0, fixed modes, no name or time in the gzip header (-n) and no extra zip fields (-X).
      # The flags are GNU tar's and coreutils' (the ubuntu runner); BSD tar on macOS spells them
      # differently.
      - name: Archives
        run: |
          test "$(ls binaries | wc -l)" -eq 5
          mkdir release
          epoch="$(git log -1 --format=%ct)"
          for target in macos-arm64 macos-x64 linux-x64 linux-arm64; do
            stage="$(mktemp -d)"
            cp "binaries/strictgen-$target" "$stage/strictgen"
            chmod 0755 "$stage/strictgen"
            tar --create --format=ustar --directory="$stage" --sort=name --mtime="@$epoch" \
              --owner=0 --group=0 --numeric-owner strictgen | gzip -n -9 > "release/strictgen-$target.tar.gz"
          done
          stage="$(mktemp -d)"
          cp binaries/strictgen-windows-x64.exe "$stage/strictgen.exe"
          chmod 0755 "$stage/strictgen.exe"
          touch --date="@$epoch" "$stage/strictgen.exe"
          (cd "$stage" && zip -X -9 -q "$GITHUB_WORKSPACE/release/strictgen-windows-x64.zip" strictgen.exe)
        env:
          # zip stores local time; UTC keeps it the same on every runner.
          TZ: UTC
      # Each archive holds only its binary, executable and byte for byte the one CI smoke tested.
      # The runner is linux-x64, so that binary also runs from its archive.
      - name: Check the archives
        run: |
          for target in macos-arm64 macos-x64 linux-x64 linux-arm64; do
            archive="release/strictgen-$target.tar.gz"
            test "$(tar --list --gzip --file="$archive")" = "strictgen"
            out="$(mktemp -d)"
            tar --extract --gzip --file="$archive" --directory="$out"
            test -x "$out/strictgen"
            cmp "$out/strictgen" "binaries/strictgen-$target"
          done
          test "$(unzip -Z1 release/strictgen-windows-x64.zip)" = "strictgen.exe"
          out="$(mktemp -d)"
          unzip -q release/strictgen-windows-x64.zip -d "$out"
          cmp "$out/strictgen.exe" binaries/strictgen-windows-x64.exe
          out="$(mktemp -d)"
          tar --extract --gzip --file=release/strictgen-linux-x64.tar.gz --directory="$out"
          printed="$("$out/strictgen" --version)"
          if [[ "$printed" != "$VERSION" ]]; then
            echo "::error::strictgen --version from the linux-x64 archive printed \"$printed\", not $VERSION."
            exit 1
          fi
        env:
          VERSION: ${{ needs.guard.outputs.version }}
      # The tarball packed here, from this build, is the one the npm job publishes.
      - name: SHA-256 sums, release notes and the npm tarball
        run: |
          (cd release && sha256sum strictgen-*.tar.gz strictgen-*.zip > SHA256SUMS)
          test "$(wc -l < release/SHA256SUMS)" -eq 5
          cat release/SHA256SUMS
          notes=()
          if [[ "$PUBLISH" != "true" ]]; then notes=(--dry-run); fi
          node scripts/release-notes.mjs "$VERSION" "${notes[@]}" > release/NOTES.md
          printf '\nThe binaries are Node single executable applications built with Node %s.\n' "$(cat .github/binary-node-version)" >> release/NOTES.md
          npm pack --ignore-scripts --pack-destination release
          test -f "release/strictgen-$VERSION.tgz"
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          PUBLISH: ${{ needs.guard.outputs.publish }}
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release
          if-no-files-found: error
          retention-days: 7

  npm:
    name: Publish to npm
    needs: [guard, assemble]
    if: needs.guard.outputs.publish == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    # Holds NPM_TOKEN and waits for a maintainer's approval before the job starts.
    environment: release
    permissions:
      contents: read
      # The OIDC token npm signs the provenance statement with.
      id-token: write
    steps:
      - name: Check that the NPM_TOKEN secret is set
        run: |
          if [[ "$TOKEN_SET" != "true" ]]; then
            echo "::error::The NPM_TOKEN secret isn't set in the release environment."
            exit 1
          fi
        env:
          TOKEN_SET: ${{ secrets.NPM_TOKEN != '' }}
      # The API's answer counts too: both must say public, or nothing is published.
      - name: Check that the repository is public
        run: |
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)"
          if [[ "$visibility" != "public" ]]; then
            echo "::error::The repository is $visibility, so nothing is published."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      # npm doesn't run prepublishOnly for a tarball, so the guard runs here first. The tarball is
      # the one assemble packed, not a new build. A version with a prerelease part, like
      # 1.0.0-rc.1, goes to the next dist-tag instead of latest.
      - name: npm publish
        run: |
          node scripts/publish-guard.mjs
          if [[ "$VERSION" == *-* ]]; then tag=next; else tag=latest; fi
          npm publish "release/strictgen-$VERSION.tgz" --provenance --access public --tag "$tag"
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: GitHub release
    needs: [guard, npm]
    if: needs.guard.outputs.publish == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      # Creating a release and uploading its files.
      contents: write
    steps:
      - name: Check that the repository is public
        run: |
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)"
          if [[ "$visibility" != "public" ]]; then
            echo "::error::The repository is $visibility, so no release is created."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Create the release
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "v$VERSION" --notes-file release/NOTES.md "${prerelease[@]}" \
            release/strictgen-macos-arm64.tar.gz release/strictgen-macos-x64.tar.gz \
            release/strictgen-linux-x64.tar.gz release/strictgen-linux-arm64.tar.gz \
            release/strictgen-windows-x64.zip release/SHA256SUMS
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          GH_TOKEN: ${{ github.token }}
