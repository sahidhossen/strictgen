name: Playground

# Deploys the playground (playground/) to GitHub Pages. It runs only by hand, and only while the
# repository is public: both jobs are skipped for a private one, and the build job checks the
# visibility again through the API before it uploads anything. It doesn't turn Pages on; set Pages
# to deploy from GitHub Actions in the repository settings first. CI builds and tests the page on
# every pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the playground
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - name: Check that the repository is public
        run: |
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)"
          if [[ "$visibility" != "public" ]]; then
            echo "The repository is $visibility, so the playground is not deployed."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm playground:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
